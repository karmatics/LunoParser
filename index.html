<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LunoParser & AST Test Suite</title>
  <link rel="stylesheet" href="styles.css" />
    <!-- Acorn AST Parser (CDN with secondary CDN fallback) -->
  <script src="https://cdn.jsdelivr.net/npm/acorn@8.11.3/dist/acorn.min.js" onerror="this.onerror=null; this.src='https://cdnjs.cloudflare.com/ajax/libs/acorn/8.11.3/acorn.min.js';"></script>
  
  <!-- Luno Core mock helpers to ensure client tests for browser/manifest pass -->
  <script src="/Luno/app/LunoFileSystem.js"></script>
  <script src="/Luno/app/LunoApiClient.js"></script>
  <script src="/Luno/app/LunoManifestDecisionEngine.js"></script>
  <script src="/Luno/app/OutboxQueue.js"></script>
  <script src="/Luno/browser/DiskBrowser.js"></script>
  <script src="/Luno/app/LunoDeployEngine.js"></script>
  <script src="/Luno/app/ClientAppPaster.js"></script>
  
  <!-- Canonical LunoParser Engine Files -->
  <script src="./LunoPayloadParser.js"></script>
  <script src="./LunoClassPatcher.js"></script>
  <script src="./LunoTestRunner.js"></script>

  <!-- Shared Library Loader -->
  <script src="/Library/LunoLoader.js" onerror="this.onerror=null; (function(el){ var u=(window.location.hostname.endsWith('.github.io')?window.location.hostname.split('.')[0]:'karmatics'); el.src='https://'+u+'.github.io/Library/LunoLoader.js'; el.onerror=function(){ el.onerror=null; el.src='https://karmatics.github.io/Library/LunoLoader.js'; }; })(this);"></script>
</head>
<body>
  <div id="app-container">
    <div style="padding: 1.5rem; text-align: center; color: #00f2fe; font-family: monospace;">
      ⚡ Initializing LunoParser test suite...
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", async function() {
      const container = document.getElementById("app-container");
      if (typeof LunoTestRunner !== "undefined") {
        LunoTestRunner.mountUI(container);
      }
    });
  </script>
</body>
</html>
