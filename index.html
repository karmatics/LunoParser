<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luno Diagnostic Tests</title>
  <style>
    body { background: #0d1117; color: #c9d1d9; font-family: monospace; padding: 1rem; margin: 0; min-height: 100vh; }
    #test-root { max-width: 780px; margin: 0 auto; }
  </style>
  <script src="/Luno/app/acorn.js"></script>
  <script src="/Library/DomBasics.js"></script>
  <script src="/Luno/core/LunoClassPatcher.js"></script>

  <script src="./LunoTestRunner.js"></script>
</head>
<body>
  <div id="test-root"></div>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof LunoTestRunner !== "undefined") {
        LunoTestRunner.mountUI(document.getElementById("test-root"));
      }
    });
  </script>
</body>
</html>
